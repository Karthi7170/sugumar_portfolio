name: Build browser-ready portfolio videos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public/videos/**"
      - ".github/workflows/build-web-videos.yml"

permissions:
  contents: write

jobs:
  transcode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Fetch LFS video objects
        run: git lfs pull

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Transcode portfolio videos for browsers
        run: |
          set -euxo pipefail
          mkdir -p public/web-videos

          ffmpeg -y -i "public/videos/sugu.MOV"             -vf "scale=-2:720,fps=30"             -c:v libx264 -profile:v high -level 4.0 -preset medium -crf 25             -maxrate 3000k -bufsize 6000k -pix_fmt yuv420p             -c:a aac -b:a 128k -movflags +faststart             "public/web-videos/portrait-story.mp4"

          ffmpeg -y -i "public/videos/Sugu_bike.MP4"             -vf "scale=-2:720,fps=30"             -c:v libx264 -profile:v high -level 4.0 -preset medium -crf 25             -maxrate 3000k -bufsize 6000k -pix_fmt yuv420p             -c:a aac -b:a 128k -movflags +faststart             "public/web-videos/ride-in-motion.mp4"

          ffmpeg -y -i "public/videos/IMG_6606.MP4"             -vf "scale=-2:720,fps=30"             -c:v libx264 -profile:v high -level 4.0 -preset medium -crf 25             -maxrate 3000k -bufsize 6000k -pix_fmt yuv420p             -c:a aac -b:a 128k -movflags +faststart             "public/web-videos/skyone-brand-film.mp4"

          ffmpeg -y -i "public/videos/IMG_7269.MOV"             -vf "scale=720:-2,fps=30"             -c:v libx264 -profile:v high -level 4.0 -preset medium -crf 25             -maxrate 3000k -bufsize 6000k -pix_fmt yuv420p             -c:a aac -b:a 128k -movflags +faststart             "public/web-videos/training-energy.mp4"

          ffmpeg -y -i "public/videos/Triumph.MP4"             -vf "scale=-2:720,fps=30"             -c:v libx264 -profile:v high -level 4.0 -preset medium -crf 25             -maxrate 3000k -bufsize 6000k -pix_fmt yuv420p             -c:a aac -b:a 128k -movflags +faststart             "public/web-videos/triumph-road-film.mp4"

      - name: Commit optimized videos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/web-videos/*.mp4
          if git diff --cached --quiet; then
            echo "No video changes to commit."
            exit 0
          fi
          git commit -m "Generate browser-ready portfolio videos [web-video-build]"
          git push
